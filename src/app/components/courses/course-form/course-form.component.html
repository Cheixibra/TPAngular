

<div class="container py-5">
	<div class="row justify-content-center">
		<div class="col-md-8 col-lg-6">
			<div class="card shadow border-0">
				<div class="card-header bg-primary text-white text-center">
					<h4 class="mb-0">{{ isEditMode ? 'Modifier' : 'Ajouter' }} un cours</h4>
				</div>
				<div class="card-body">
					<form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
						<div class="mb-3">
							<label for="name" class="form-label">Nom du cours</label>
							<input type="text" class="form-control" id="name" formControlName="name" placeholder="Nom du cours">
							<div *ngIf="courseForm.controls['name'].invalid && courseForm.controls['name'].touched" class="text-danger small">Le nom est obligatoire</div>
						</div>
						<div class="mb-3">
							<label for="description" class="form-label">Description</label>
							<textarea class="form-control" id="description" formControlName="description" rows="3" placeholder="Description du cours"></textarea>
							<div *ngIf="courseForm.controls['description'].invalid && courseForm.controls['description'].touched" class="text-danger small">La description est obligatoire</div>
						</div>
						<div class="mb-3">
							<label for="credits" class="form-label">Crédits</label>
							<input type="number" class="form-control" id="credits" formControlName="credits" min="1" placeholder="Nombre de crédits">
							<div *ngIf="courseForm.controls['credits'].invalid && courseForm.controls['credits'].touched" class="text-danger small">Le nombre de crédits est obligatoire</div>
						</div>
						<div class="mb-3">
							<label for="teacher" class="form-label">Enseignant</label>
							<input type="text" class="form-control" id="teacher" formControlName="teacher" placeholder="Nom de l'enseignant">
							<div *ngIf="courseForm.controls['teacher'].invalid && courseForm.controls['teacher'].touched" class="text-danger small">L'enseignant est obligatoire</div>
						</div>
						<div class="d-flex justify-content-between">
							<button type="submit" class="btn btn-success px-4" [disabled]="courseForm.invalid">{{ isEditMode ? 'Enregistrer' : 'Ajouter' }}</button>
							<a [routerLink]="['/courses']" class="btn btn-outline-secondary px-4">Annuler</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
