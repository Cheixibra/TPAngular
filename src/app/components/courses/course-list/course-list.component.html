

<div class="container py-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h2 class="fw-bold text-primary">Liste des cours</h2>
		<a class="btn btn-success" routerLink="/courses/add"><i class="bi bi-plus-circle"></i> Ajouter un cours</a>
	</div>
	<div class="table-responsive shadow rounded">
		<table class="table table-hover align-middle mb-0">
			<thead class="table-light">
				<tr>
					<th>Nom</th>
					<th>Description</th>
					<th>Crédits</th>
					<th>Enseignant</th>
					<th class="text-end">Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr *ngFor="let course of courses">
					<td>{{ course.name }}</td>
					<td>{{ course.description }}</td>
					<td>{{ course.credits }}</td>
					<td>{{ course.teacher }}</td>
					<td class="text-end">
						<button class="btn btn-outline-primary btn-sm me-2" (click)="editCourse(course)"><i class="bi bi-pencil"></i> Modifier</button>
						<button class="btn btn-outline-danger btn-sm" (click)="deleteCourse(course)"><i class="bi bi-trash"></i> Supprimer</button>
					</td>
				</tr>
				<tr *ngIf="courses.length === 0">
					<td colspan="5" class="text-center text-muted">Aucun cours trouvé.</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
