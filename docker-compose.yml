version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-username}/ecole-manager:${VERSION:-latest}
    container_name: ecole-manager
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    networks:
      - ecole_network
    restart: unless-stopped

volumes:
  nginx_logs:

networks:
  ecole_network:
    driver: bridge